<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>i-kirtasiye — B2B Pazaryeri Tasarımı</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body, #root { height: 100%; }
  body { background: #1f1f1c; }

  [data-typography="manrope"] { --font-sans: "Manrope", system-ui, sans-serif; }
  [data-typography="plex"]    { --font-sans: "IBM Plex Sans", system-ui, sans-serif; }

  .dc-stage-bg { background: #1a1a17; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="page-market.jsx"></script>
  <script type="text/babel" src="page-category.jsx"></script>
  <script type="text/babel" src="page-detail.jsx"></script>
  <script type="text/babel" src="page-search.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "palette": "amber",
      "typography": "inter",
      "density": "medium",
      "cardLayout": "grid",
      "cardStyle": "solid",
      "darkMode": false
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply tweaks to <html> element via data-* attrs picked up by styles.css
      React.useEffect(() => {
        const html = document.documentElement;
        html.setAttribute("data-palette", tweaks.palette);
        html.setAttribute("data-typography", tweaks.typography);
        html.setAttribute("data-density", tweaks.density);
        html.setAttribute("data-theme", tweaks.darkMode ? "dark" : "light");
      }, [tweaks]);

      // Each artboard is its own page surface; design-canvas wraps them.
      // We pass cardLayout/cardStyle through context-ish: read from window for components.
      window.IKLayout = tweaks.cardLayout;
      window.IKCardStyle = tweaks.cardStyle;

      const W = 1440;

      return (
        <>
          <DesignCanvas title="i-kirtasiye · B2B Pazaryeri" subtitle="Market · Kategori · Ürün Detay · Arama Sonuçları">
            <DCSection id="market" title="Market (Anasayfa)">
              <DCArtboard id="market-1" label="Market — kategoriler, kampanyalar, öne çıkan ilanlar" width={W} height={3000}>
                <MarketPage />
              </DCArtboard>
            </DCSection>
            <DCSection id="category" title="Kategori sayfası">
              <DCArtboard id="category-1" label="Kategori — sol filtre + grid" width={W} height={2200}>
                <CategoryPage />
              </DCArtboard>
            </DCSection>
            <DCSection id="detail" title="Ürün detay sayfası">
              <DCArtboard id="detail-1" label="Ürün detay — ilan listesi vurgulu" width={W} height={2400}>
                <ProductDetailPage />
              </DCArtboard>
            </DCSection>
            <DCSection id="search" title="Arama sonuçları">
              <DCArtboard id="search-1" label="Arama — list görünüm + sponsorlu ilan" width={W} height={2200}>
                <SearchPage />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection title="Renk paleti">
              <TweakSelect
                value={tweaks.palette}
                onChange={(v) => setTweak("palette", v)}
                options={[
                  { value: "ocean", label: "Ocean (mavi)" },
                  { value: "forest", label: "Forest (yeşil)" },
                  { value: "amber", label: "Amber (turuncu)" },
                  { value: "violet", label: "Violet (mor)" },
                  { value: "graphite", label: "Graphite (nötr)" },
                ]}
              />
              <TweakToggle
                label="Karanlık mod"
                checked={tweaks.darkMode}
                onChange={(v) => setTweak("darkMode", v)}
              />
            </TweakSection>

            <TweakSection title="Tipografi">
              <TweakRadio
                value={tweaks.typography}
                onChange={(v) => setTweak("typography", v)}
                options={[
                  { value: "inter", label: "Inter" },
                  { value: "manrope", label: "Manrope" },
                  { value: "plex", label: "IBM Plex" },
                ]}
              />
            </TweakSection>

            <TweakSection title="Yoğunluk">
              <TweakRadio
                value={tweaks.density}
                onChange={(v) => setTweak("density", v)}
                options={[
                  { value: "compact", label: "Kompakt" },
                  { value: "medium", label: "Orta" },
                  { value: "airy", label: "Ferah" },
                ]}
              />
            </TweakSection>

            <TweakSection title="Kart layout (kategori/arama)">
              <TweakRadio
                value={tweaks.cardLayout}
                onChange={(v) => setTweak("cardLayout", v)}
                options={[
                  { value: "grid", label: "Grid" },
                  { value: "list", label: "Liste" },
                ]}
              />
            </TweakSection>

            <TweakSection title="İlan kartı stili">
              <TweakRadio
                value={tweaks.cardStyle}
                onChange={(v) => setTweak("cardStyle", v)}
                options={[
                  { value: "solid", label: "Gölgeli" },
                  { value: "outline", label: "Sade" },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
